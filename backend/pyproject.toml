[project]
name = "trs"
version = "0.1.0"
description = "Preclinical Translational Risk Scorer — estimates and explains the risk that preclinical evidence fails to translate into human clinical efficacy"
requires-python = ">=3.11"
authors = [{ name = "Jorge Rodriguez" }]
# SPDX expression rather than a `license-files` glob: the licence lives at the
# repository root, and pointing setuptools outside the project directory is the
# exact mistake documented below for `readme`. Needs setuptools >= 77.
license = "MIT"
# No `readme` key: setuptools refuses to read a readme from outside the project
# directory, and the project README lives at the repository root because it
# documents the frontend too. Pointing at "../README.md" makes `pip install -e`
# fail outright, which is worse than having no long_description on a package
# that is never published to an index.

dependencies = [
  # Scientific stack. The modelling layer is usable without the web layer.
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",

  # Persistence. PostgreSQL is the production target; SQLite is the local default.
  "SQLAlchemy>=2.0",
  "alembic>=1.13",

  # Web layer.
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",

  # Security.
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]
# Full Bayesian inference. Not required: the deployed linear families use an
# analytic Laplace posterior. PyMC becomes justified only when variance-component
# uncertainty in the hierarchical model must be propagated rather than plugged in
# — see MODELING_PLAN.md.
bayes = ["pymc>=5.10"]

[project.scripts]
trs = "trs.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]  # >=77 for the SPDX `license` field
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "slow: tests that take more than a few seconds (deselect with -m 'not slow')",
  "network: tests that require live network access (deselected by default)",
]
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
  # ANN101/ANN102 were removed from ruff; self/cls need no annotation.
  "ANN401",            # Any is deliberate in JSON payload boundaries
  "E501",              # long lines are allowed in prose docstrings
  "B008",              # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"trs/db/migrations/*" = ["ANN", "E", "F", "I"]
